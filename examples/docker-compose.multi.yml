# docker-compose.multi.yml
# Multi-mailbox example with Telegram digest notifications.
#
# Three mailboxes are cleaned in a single container run:
#   - user1@example.com  →  INBOX,   delete after 10 days
#   - user2@example.com  →  INBOX,   delete after 30 days
#   - user3@other.com    →  Archive, delete after 60 days
#
# Notifications are sent as a weekly digest every Sunday at 08:00
# and only when at least one email was actually deleted.
#
# Passwords and tokens are read from environment variables so they never
# appear in plain text in this file. Define them in a .env file alongside
# this compose file, or in the "Environment variables" panel in Portainer:
#
#   USER1_PASS=secret1
#   USER2_PASS=secret2
#   USER3_PASS=secret3
#   TELEGRAM_BOT_TOKEN=123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ
#   TELEGRAM_CHAT_ID=987654321
#
# IMPORTANT — Portainer users: do NOT stop the existing stack manually before
# redeploying; just click "Update the stack". If a container name or port
# conflict causes a 500 error, stop and remove the old stack first.
#
# Usage:
#   cp examples/docker-compose.multi.yml docker-compose.yml
#   # Fill in your .env file, then:
#   docker compose up -d
#
# Status page: http://localhost:8080

services:
  email-cleaner:
    image: ghcr.io/gioxx/clean-mail-automation:latest
    container_name: email-cleaner-multi
    restart: unless-stopped

    environment:
      # ── Multi-mailbox config (JSON array, one line) ────────────
      # Passwords come from env vars — define them in .env or Portainer.
      - MAILBOX_CONFIGS=[{"imap_server":"imap.example.com","imap_port":993,"email_user":"user1@example.com","email_pass":"${USER1_PASS}","email_address":"user1@example.com","mailbox":"INBOX","clean_days":10},{"imap_server":"imap.example.com","imap_port":993,"email_user":"user2@example.com","email_pass":"${USER2_PASS}","email_address":"user2@example.com","mailbox":"INBOX","clean_days":30},{"imap_server":"imap.other.com","imap_port":993,"email_user":"user3@other.com","email_pass":"${USER3_PASS}","email_address":"user3@other.com","mailbox":"Archive","clean_days":60}]

      # ── Schedule (cron inside the container) ──────────────────
      # Every day at 02:00
      - SCHEDULE_DAY=*
      - SCHEDULE_HOUR=2
      - SCHEDULE_MIN=0

      # ── Telegram notifications ─────────────────────────────────
      - SEND_TELEGRAM_NOTIFICATIONS=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Digest mode: accumulate results and send once a week
      - TELEGRAM_NOTIFY_MODE=digest
      # Only notify when something was actually deleted
      - TELEGRAM_NOTIFY_ONLY_IF_DELETED=true
      # Digest sent every Sunday at 08:00
      - DIGEST_SCHEDULE_DAY=0
      - DIGEST_SCHEDULE_HOUR=8
      - DIGEST_SCHEDULE_MIN=0

    ports:
      - "8080:8080"   # web status page → http://localhost:8080
